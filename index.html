<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teste de Voz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #f0f8ff;
    }
    h1 { color: #2c3e50; }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #45a049; }
  </style>
</head>
<body>
  <h1>🔊 Teste de Fala Online</h1>
  <p>Clique no botão abaixo para ouvir uma mensagem em português.</p>
  <button onclick="falar()">Falar "Olá, tudo bem?"</button>

  <script>
    function falar() {
      const text = "Olá, tudo bem?";
      const audio = new Audio(`/tts?text=${encodeURIComponent(text)}`);
      audio.onerror = () => alert("Erro ao reproduzir áudio. Verifique sua conexão.");
      audio.play();
    }
  </script>
</body>
</html>
