<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TTS Teste</title>
</head>
<body>
  <h3>Digite um texto e clique para ouvir:</h3>

  <textarea id="texto" rows="4" cols="40">Oi, tudo bem?</textarea><br><br>

  <button onclick="falar()">Falar</button>

  <script>
    function falar() {
      if (!('speechSynthesis' in window)) {
        alert("Seu navegador não suporta TTS (SpeechSynthesis).");
        return;
      }

      const texto = document.getElementById("texto").value;
      const fala = new SpeechSynthesisUtterance(texto);

      // Configurações
      fala.lang = "pt-BR";
      fala.rate = 1.0;
      fala.pitch = 1.0;

      speechSynthesis.speak(fala);
    }
  </script>

</body>
</html>
