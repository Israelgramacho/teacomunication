<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>TTS Teste</title>
</head>
<body>

<h3>Digite um texto e clique para ouvir:</h3>

<textarea id="texto" rows="4" cols="40">Oi, tudo bem?</textarea><br><br>

<label for="voz">Voz:</label>
<select id="voz"></select><br><br>

<label for="pitch">Pitch (tom):</label>
<input type="range" id="pitch" min="0" max="2" value="1" step="0.1">
<span id="pitchVal">1</span><br><br>

<button onclick="falar()">Falar</button>

<script>
let availableVoices = [];

function loadVoices() {
  availableVoices = speechSynthesis.getVoices();
  const vozSelect = document.getElementById("voz");
  vozSelect.innerHTML = "";

  // Filtrar apenas PT-BR e EN-US disponíveis
  const filtradas = availableVoices.filter(v =>
    v.lang.includes("pt") || v.lang.includes("en")
  );

  filtradas.forEach(v => {
    const opt = document.createElement("option");
    opt.value = v.name;
    opt.textContent = `${v.name} (${v.lang})`;
    vozSelect.appendChild(opt);
  });

  // Seleciona automaticamente uma voz PT-BR, se existir
  const ptIndex = filtradas.findIndex(v => v.lang.includes("pt-BR"));
  if (ptIndex >= 0) vozSelect.selectedIndex = ptIndex;
}

if ("speechSynthesis" in window) {
  speechSynthesis.onvoiceschanged = loadVoices;
  loadVoices();
}

document.getElementById("pitch").addEventListener("input", (e) => {
  document.getElementById("pitchVal").innerText = e.target.value;
});

function falar() {
  const texto = document.getElementById("texto").value;
  const pitch = parseFloat(document.getElementById("pitch").value);
  const vozName = document.getElementById("voz").value;

  const fala = new SpeechSynthesisUtterance(texto);
  fala.pitch = pitch;

  const voice = availableVoices.find(v => v.name === vozName);
  if (voice) fala.voice = voice;

  speechSynthesis.cancel();
  speechSynthesis.speak(fala);
}
</script>

</body>
</html>
