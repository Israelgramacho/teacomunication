<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Teste de Voz</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px;
      background: #f0f8ff;
    }
    h1 { color: #2c3e50; }
    button {
      padding: 12px 24px;
      font-size: 18px;
      background: #4CAF50;
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin-top: 20px;
    }
    button:hover { background: #45a049; }
    button:disabled {
      background: #ccc;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <h1>🔊 Teste de Fala Online</h1>
  <p>Clique no botão abaixo para ouvir uma mensagem em português.</p>
  <button id="falarBtn" onclick="falar()">Falar "Olá, tudo bem?"</button>

  <script>
    async function falar() {
      const btn = document.getElementById('falarBtn');
      btn.disabled = true;
      try {
        const text = "Olá, tudo bem?";
        const response = await fetch(`/tts?text=${encodeURIComponent(text)}`);
        
        if (!response.ok) {
          throw new Error('Erro no servidor');
        }
        
        const blob = await response.blob();
        const audio = new Audio(URL.createObjectURL(blob));
        audio.onerror = (e) => {
          console.error('Erro no áudio:', e);
          alert("Erro ao reproduzir áudio. Verifique sua conexão.");
        };
        await audio.play();
      } catch (error) {
        console.error('Erro:', error);
        alert("Erro ao gerar ou reproduzir áudio. Tente novamente.");
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
